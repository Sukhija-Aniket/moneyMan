[project]
name = "moneyman-worker"
version = "0.1.0"
description = "Two-stage Pulsar consumer: fetches Gmail messages per sync segment and classifies/extracts each candidate email (see docs/design.md)."
requires-python = ">=3.11"
dependencies = [
    "moneyman-shared",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]
