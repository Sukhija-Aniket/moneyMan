[project]
name = "moneyman-worker"
version = "0.1.0"
description = "Consumes gmail-sync-jobs from Pulsar, runs the Gmail fetch + classify/extract pipeline, and publishes completion events."
requires-python = ">=3.11"
dependencies = [
    "moneyman-shared",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]
